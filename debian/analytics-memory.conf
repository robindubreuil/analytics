# Memory limits for the analytics service (SQLite cache is capped at 64MB,
# so the service stays comfortably under 96MB hard limit).
# Installed as /usr/lib/systemd/system/analytics.service.d/memory.conf;
# an admin override in /etc/systemd/system/analytics.service.d/ (same
# filename) still takes precedence per systemd drop-in precedence rules.
[Service]
MemoryHigh=64M
MemoryMax=96M
